name: Build

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: "src"

      - name: Setup JDK 21
        uses: actions/setup-java@8df1039f93652f10d1b1444119864434bda705a8 # v4.5.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew makePluginsJson --no-daemon
          mkdir -p $GITHUB_WORKSPACE/builds
          cp -f build/*.cs3 $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          cp -f build/plugins.json $GITHUB_WORKSPACE/builds/repo.json 2>/dev/null || cp -f build/plugins.json $GITHUB_WORKSPACE/builds/ 2>/dev/null || true

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -b builds
          git add .
          git commit -m "Updated plugins" || true
          git push -u origin builds --force
